name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NUXT_DATABASE_TEST_URL: ${{ secrets.NUXT_DATABASE_TEST_URL }}
      NUXT_DATABASE_TEST_DIRECT_URL: ${{ secrets.NUXT_DATABASE_TEST_DIRECT_URL }}
      NUXT_BETTER_AUTH_SECRET: ${{ secrets.NUXT_BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:neon
        if: env.NUXT_DATABASE_TEST_URL != '' && env.NUXT_DATABASE_TEST_DIRECT_URL != ''
      - run: npm run test:auth-neon
        if: env.NUXT_DATABASE_TEST_URL != '' && env.NUXT_BETTER_AUTH_SECRET != ''
      - run: npm run test:studio-http
        if: env.NUXT_DATABASE_TEST_URL != '' && env.NUXT_DATABASE_TEST_DIRECT_URL != '' && env.NUXT_BETTER_AUTH_SECRET != ''
      - run: npm run test:album-neon
        if: env.NUXT_DATABASE_TEST_URL != '' && env.NUXT_DATABASE_TEST_DIRECT_URL != ''
